name: Release

# A version tag (v1.2.3) builds the Windows installer and attaches it, with the updater's
# latest.json, to a draft release; then the Android APKs join it. Publishing the draft
# makes it the update the apps see. The tag must match the apps' version (package.json in
# apps/desktop and apps/mobile).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update, so installed apps accept it.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: Webnovel Hub ${{ github.ref_name }}
          releaseBody: Download the installer below.
          releaseDraft: true

  android:
    name: Android APKs
    # Adds to the draft release the Windows job created.
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Check the tag matches the app's version
        run: test "v$(node -p "require('./apps/mobile/package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run sync --workspace @webnovel-hub/mobile
      - name: Build the signed APKs
        env:
          # The upload key: losing it means installed apps can never update again.
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_FILE"
          cd apps/mobile/android
          ./gradlew assembleRelease --no-daemon
      - name: Attach them to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir apks
          built=apps/mobile/android/app/build/outputs/apk/release
          for abi in arm64-v8a armeabi-v7a x86_64 universal; do
            cp "$built/app-$abi-release.apk" "apks/webnovel-hub-$GITHUB_REF_NAME-android-$abi.apk"
          done
          (cd apks && sha256sum *.apk > "webnovel-hub-$GITHUB_REF_NAME-android-sha256.txt")
          gh release upload "$GITHUB_REF_NAME" apks/* --clobber
